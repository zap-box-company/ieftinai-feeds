name: Nightly catalog import

on:
  schedule:
    - cron: "30 2 * * *" # 05:30 Romania (summer time), after the networks refresh their feeds
  workflow_dispatch:
    inputs:
      budget:
        description: "Max D1 rows written this run"
        default: "1000000"
      ps_parts:
        description: "Profitshare rotation: 3 = a third of the shops in full per night, 1 = all"
        default: "3"

concurrency:
  group: catalog-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 170 # nights ~50 min; a manual run with ps_parts=1 reads all of Profitshare (~2 h)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Import feeds into D1
        env:
          TP_FEED_URL: ${{ secrets.TP_FEED_URL }}
          TP_FEED_URLS: ${{ secrets.TP_FEED_URLS }}
          PS_API_USER: ${{ secrets.PS_API_USER }}
          PS_API_KEY: ${{ secrets.PS_API_KEY }}
          PS_PROXY_URL: https://ieftinai-affiliate.ieftinai.workers.dev # Profitshare refuses GitHub runners
          NODE_OPTIONS: --max-old-space-size=5120 # 2M+ feed rows in memory
          PS_ROTATION_PARTS: ${{ github.event.inputs.ps_parts || '3' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node src/run.js --budget "${{ github.event.inputs.budget || '1000000' }}"
      - name: Map shop categories onto the eMAG tree
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node src/category-sync.js
      - name: Rebuild "Cele mai căutate"
        continue-on-error: true # needs migration 0005 (trending table) on the catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node src/trending.js
      - name: Tell IndexNow (Bing and others) which pages to read
        continue-on-error: true
        run: node src/indexnow.js
